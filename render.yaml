services:
  - type: web
    name: zomato-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: MAX_CANDIDATES_FOR_LLM
        value: "5"
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
